[project]
name = "school-daily-log"
version = "1.0.0"
description = "School Daily Log Extractor - Google Drive Auto-Sync with NVIDIA Llama"
requires-python = ">=3.8.1"
dependencies = [
    "flask==3.0.0",
    "openai==1.11.1",
    "httpx==0.24.1",
    "python-dotenv==1.0.0",
    "gspread==6.0.0",
    "google-auth==2.28.0",
    "google-auth-oauthlib==1.2.0",
    "google-auth-httplib2==0.2.0",
    "google-api-python-client==2.108.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "black==23.12.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
